          SMART_FINAL_FILES
          python3 - <<'PYSMART'
          from pathlib import Path
          root = Path('V2rayNG')
          code = root/'app/src/main/java/com/v2ray/ang/ui/main'
          smart = (code/'SmartDashboard.kt').read_text(encoding='utf-8')
          flags = (code/'CountryFlagDetector.kt').read_text(encoding='utf-8')
          for token in ('MainAction.ImportClipboard', 'MainAction.ImportQRcode',
                        'MainDestination.Settings', 'CountryFlagDetector.flagFromRemarks',
                        'showManualServers', 'MainAction.SelectServer(row.guid)',
                        '"رفع مشکل"', '"انتخاب دستی سرور"'):
              if token not in smart:
                  raise SystemExit('SMART FINAL feature missing: ' + token)
          for token in ('fun codeFromRemarks', 'fun flagFromRemarks', 'return "🌐"'):
              if token not in flags:
                  raise SystemExit('Country detection missing: ' + token)
          if 'ModalNavigationDrawer' in smart:
              raise SystemExit('Unexpected old navigation drawer')
          gradle = root/'app/build.gradle.kts'
          s = gradle.read_text(encoding='utf-8')
          assert s.count('applicationIdSuffix = ".smartclient"') == 1, 'Missing SMART appId'
          assert s.count('2.3.13-SMART-CLIENT') == 1, 'Missing SMART version'
          s = s.replace('applicationIdSuffix = ".smartclient"',
                        'applicationIdSuffix = ".smartflags"', 1)
          s = s.replace('2.3.13-SMART-CLIENT',
                        '2.3.13-SMART-FLAGS', 1)
          gradle.write_text(s, encoding='utf-8')
          strings = root/'app/src/main/res/values/strings.xml'
          t = strings.read_text(encoding='utf-8')
          assert 'v2rayNG SMART</string>' in t, 'App name not found'
          t = t.replace('v2rayNG SMART</string>', 'VPN SMART</string>', 1)
          strings.write_text(t, encoding='utf-8')
          print('SMART FINAL + country flags source applied and validated.')
          PYSMART

      - name: Build APK
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod 755 gradlew
          ./gradlew :app:assemblePlaystoreDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: v2rayng-SMART-FINAL-FLAGS-debug-apk
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
          retention-days: 7
