      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          sed -i '10i\
            ndkVersion = "30.0.16248370"' "$GITHUB_WORKSPACE/V2rayNG/app/build.gradle.kts"

      - name: Build HEV tun library
        run: bash compile-hevtun.sh

      - name: Copy HEV libraries
        run: |
          mkdir -p V2rayNG/app/libs
          cp -r libs/. V2rayNG/app/libs/

      - name: Get AndroidLibXrayLite tag
        run: |
          CURRENT_TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: 'V2rayNG/app/libs/'

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Use separate package ID for test build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("V2rayNG/app/build.gradle.kts")
          s = p.read_text()
          marker = "buildTypes {\n"
          if marker not in s:
              raise SystemExit("Could not find buildTypes block")
          if 'applicationIdSuffix = ".beautyblue"' not in s:
              s = s.replace(
                  marker,
                  marker + '    debug {\n        applicationIdSuffix = ".beautyblue"\n    }\n',
                  1,
              )
          p.write_text(s)
          PY

      - name: Verify custom features and mark QUALITY build
        run: |
          grep -Fq 'CompactMainActionButton(' V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainTopBar.kt
          grep -Fq 'MainAction.TestRealAllServers' V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainTopBar.kt
          grep -Fq 'qualityCheck = true' V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('V2rayNG/app/src/main/res/values/strings.xml')
          content = p.read_text(encoding='utf-8')
          old = '<string name="app_name" translatable="false">v2rayNG</string>'
          if old not in content:
              raise SystemExit('Could not find original app label in strings.xml')
          p.write_text(content.replace(old, '<string name="app_name" translatable="false">v2rayNG BEAUTY BLUE</string>', 1), encoding='utf-8')
          p = Path('V2rayNG/app/build.gradle.kts')
          content = p.read_text(encoding='utf-8')
          old = 'versionName = "2.3.13"'
          if old not in content:
              raise SystemExit('Could not locate app versionName')
          p.write_text(content.replace(old, 'versionName = "2.3.13-BEAUTY-BLUE"', 1), encoding='utf-8')
          PY

      - name: Hide subscription controls and configuration sharing shortcuts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          
          root = Path('V2rayNG/app/src/main/java/com/v2ray/ang/ui/main')
          
          def replace_once(name, old, new):
              path = root / name
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          
          # Only change icons inside the subscription information card, not Android notifications.
          replace_once('MainSubscriptionInfo.kt', '''                model.webPageUrl?.let { url ->
                              CardIconButton(
                                  iconRes = R.drawable.ic_about_24dp,
                                  contentDescription = stringResource(R.string.sub_info_open_page),
                                  onClick = { onOpenLink(url) },
                              )
                          }
                          CardIconButton(
                              iconRes = R.drawable.ic_refresh_24dp,
                              contentDescription = stringResource(R.string.title_sub_update),
                              onClick = onRefresh,
                          )
          ''', '')
          
          # Hide the per-server Share button; keep editing and deleting available.
          replace_once('MainServerPager.kt', '''                    IconButton(onClick = { actions.share(row.guid, row.profile) }, Modifier.size(36.dp)) {
                                  Icon(
                                      painterResource(R.drawable.ic_share_24dp),
                                      stringResource(R.string.title_configuration_share),
                                      Modifier.size(24.dp)
                                  )
                              }
          ''', '')
          
          # Hide sharing from the overflow menu (two-column server layouts), and Export All.
          replace_once('MainImportMenu.kt', '''    (includeManagementActions || action.isShareAction) && (!isComplexProfile || action.supportsComplexProfiles)
          ''', '''    includeManagementActions && !action.isShareAction && (!isComplexProfile || action.supportsComplexProfiles)
          ''')
          replace_once('MainImportMenu.kt', '''    items = MainMoreMenuAction.entries,
          ''', '''    items = MainMoreMenuAction.entries.filterNot { it == MainMoreMenuAction.ExportAll },
          ''')
          
          # Align tests with intentionally restricted share actions.
          test_file = Path('V2rayNG/app/src/test/java/com/v2ray/ang/ui/main/MainImportMenuTest.kt')
          if test_file.exists():
              s = test_file.read_text(encoding='utf-8')
              s = s.replace('''        val expected = listOf(
                      ServerMenuAction.ShareQRCode,
                      ServerMenuAction.ShareClipboard,
                      ServerMenuAction.ShareFullContent,
                  )
          ''', '''        val expected = emptyList<ServerMenuAction>()
          ''')
              s = s.replace('''            ServerMenuAction.entries,
          ''', '''            listOf(ServerMenuAction.Edit, ServerMenuAction.Delete),
          ''')
              s = s.replace('''            listOf(ServerMenuAction.ShareFullContent),
          ''', '''            emptyList<ServerMenuAction>(),
          ''')
              s = s.replace('''        val expected = listOf(
                      ServerMenuAction.ShareFullContent,
                      ServerMenuAction.Edit,
                      ServerMenuAction.Delete,
                  )
          ''', '''        val expected = listOf(ServerMenuAction.Edit, ServerMenuAction.Delete)
          ''')
              test_file.write_text(s, encoding='utf-8')
          
          # Give this experimental APK its own package id so existing apps remain installed.
          p = Path('V2rayNG/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          assert s.count('applicationIdSuffix = ".beautyblue"') == 1
          p.write_text(s.replace('applicationIdSuffix = ".beautyblue"', 'applicationIdSuffix = ".beautyprivate"', 1), encoding='utf-8')
          
          p = Path('V2rayNG/app/src/main/res/values/strings.xml')
          s = p.read_text(encoding='utf-8')
          assert s.count('v2rayNG BEAUTY BLUE</string>') == 1
          p.write_text(s.replace('v2rayNG BEAUTY BLUE</string>', 'v2rayNG BEAUTY PRIVATE</string>', 1), encoding='utf-8')
          
          p = Path('V2rayNG/app/build.gradle.kts')
          s = p.read_text(encoding='utf-8')
          assert s.count('2.3.13-BEAUTY-BLUE') == 1
          p.write_text(s.replace('2.3.13-BEAUTY-BLUE', '2.3.13-BEAUTY-PRIVATE', 1), encoding='utf-8')
          
          pager = (root/'MainServerPager.kt').read_text()
          subscription = (root/'MainSubscriptionInfo.kt').read_text()
          menu = (root/'MainImportMenu.kt').read_text()
          assert 'R.drawable.ic_share_24dp' not in pager
          assert 'R.drawable.ic_refresh_24dp' not in subscription
          assert 'R.drawable.ic_about_24dp' not in subscription
          assert 'includeManagementActions && !action.isShareAction' in menu
          assert 'MainMoreMenuAction.entries.filterNot' in menu
          print('Privacy UI patch applied and verified')
          PY

