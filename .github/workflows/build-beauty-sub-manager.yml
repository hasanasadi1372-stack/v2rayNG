                              return@launch
                          }
                          // Uses the existing VPN permission request and connection-start code.
                          requestServiceStart()
                      } catch (cancelled: kotlinx.coroutines.CancellationException) {
                          throw cancelled
                      } catch (error: Exception) {
                          LogUtil.e(AppConfig.TAG, "Automatic repair failed", error)
                          toastError("رفع مشکل انجام نشد؛ مجدداً تلاش کنید")
                      } finally {
                          mainViewModel.setRepairing(false)
                      }
                  }
