                  raise RuntimeError(f'{name}: expected one occurrence, got {s.count(old)}: {old[:70]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          
          def add_import(name, existing, added):
              edit(name, existing, existing+added)
          
          # Add explicit repair action and progress indicator.
          edit('MainContract.kt', '    data object RestartService : MainAction\n', '    data object RestartService : MainAction\n    data object RepairConnection : MainAction\n')
          edit('MainContract.kt', '    val isTesting: Boolean = false,\n', '    val isTesting: Boolean = false,\n    val isRepairing: Boolean = false,\n')
          
          # Bridge the async quality scan to the Activity lifecycle; never reconnect on a failed scan.
          add_import('MainViewModel.kt', 'import kotlinx.coroutines.Job\n', 'import kotlinx.coroutines.withTimeoutOrNull\n')
          edit('MainViewModel.kt', '    private var bulkTestJob: Job? = null\n', '''    private var bulkTestJob: Job? = null
              private var repairScanCompletion: CompletableDeferred<Boolean>? = null
              private var repairScanRequestId: String? = null
          
              fun setRepairing(repairing: Boolean) {
                  _uiState.update { it.copy(isRepairing = repairing) }
              }
          
              /** Tests servers with the quality scorer, then waits for the selected GUID to be persisted. */
              suspend fun scanBestServerForRepair(): Boolean {
                  val previous = repairScanCompletion
                  previous?.complete(false)
                  repairScanCompletion = null
                  repairScanRequestId = null
                  testAllRealPing(qualityCheck = true)
                  val id = testRequests.bulk?.id ?: return false
                  val completion = CompletableDeferred<Boolean>()
                  repairScanCompletion = completion
                  repairScanRequestId = id
                  val result = withTimeoutOrNull(120_000L) { completion.await() } ?: false
                  if (repairScanRequestId == id) {
                      repairScanCompletion = null
                      repairScanRequestId = null
                  }
                  return result
              }
          ''')
          # Don't send action back to the VM; Activity orchestrates stop -> scan -> start.
          edit('MainViewModel.kt', '            MainAction.RestartService,\n', '            MainAction.RestartService,\n            MainAction.RepairConnection,\n')
          edit('MainViewModel.kt', '''            is MainServiceEvent.MeasureConfigCancelled -> {
                          if (testRequests.completeBulk(event.requestId) != null) {
                              cancelPendingTestResults()
                              resetTestStatus()
                          }
