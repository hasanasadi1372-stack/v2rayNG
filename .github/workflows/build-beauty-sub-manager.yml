          old = 'applicationIdSuffix = ".beautyquietpower"'
          assert text.count(old) == 1, 'Unexpected app suffix; cannot safely edit'
          gradle.write_text(text.replace(old, 'applicationIdSuffix = ".beautysubmanage"'))
          strings = Path('V2rayNG/app/src/main/res/values/strings.xml')
          text = strings.read_text()
          old = 'v2rayNG BEAUTY QUIET</string>'
          assert text.count(old) == 1, 'Unexpected variant label'
          strings.write_text(text.replace(old, 'v2rayNG BEAUTY SUB MANAGER</string>'))
          PYSUBTITLE

      - name: Build APK
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod 755 gradlew
          ./gradlew :app:assemblePlaystoreDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: v2rayng-BEAUTY-SUB-MANAGER-debug-apk
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
          retention-days: 7
