      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          sed -i '10i\
            ndkVersion = "30.0.16248370"' "$GITHUB_WORKSPACE/V2rayNG/app/build.gradle.kts"

      - name: Build HEV tun library
        run: bash compile-hevtun.sh

      - name: Copy HEV libraries
        run: |
          mkdir -p V2rayNG/app/libs
          cp -r libs/. V2rayNG/app/libs/

      - name: Get AndroidLibXrayLite tag
        run: |
          CURRENT_TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"

      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: ${{ env.CURRENT_TAG }}
          fileName: 'libv2ray.aar'
          out-file-path: 'V2rayNG/app/libs/'

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Use separate package ID for test build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("V2rayNG/app/build.gradle.kts")
          s = p.read_text()
          marker = "buildTypes {\n"
          if marker not in s:
              raise SystemExit("Could not find buildTypes block")
          if 'applicationIdSuffix = ".beautyblue"' not in s:
              s = s.replace(
                  marker,
                  marker + '    debug {\n        applicationIdSuffix = ".beautyblue"\n    }\n',
                  1,
              )
          p.write_text(s)
          PY

      - name: Verify custom features and mark QUALITY build
        run: |
          grep -Fq 'CompactMainActionButton(' V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainTopBar.kt
          grep -Fq 'MainAction.TestRealAllServers' V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainTopBar.kt
          grep -Fq 'qualityCheck = true' V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('V2rayNG/app/src/main/res/values/strings.xml')
          content = p.read_text(encoding='utf-8')
          old = '<string name="app_name" translatable="false">v2rayNG</string>'
          if old not in content:
              raise SystemExit('Could not find original app label in strings.xml')
          p.write_text(content.replace(old, '<string name="app_name" translatable="false">v2rayNG BEAUTY BLUE</string>', 1), encoding='utf-8')
          p = Path('V2rayNG/app/build.gradle.kts')
          content = p.read_text(encoding='utf-8')
          old = 'versionName = "2.3.13"'
          if old not in content:
              raise SystemExit('Could not locate app versionName')
          p.write_text(content.replace(old, 'versionName = "2.3.13-BEAUTY-BLUE"', 1), encoding='utf-8')
          PY

