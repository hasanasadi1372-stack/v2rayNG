              // A failed end-to-end delay request takes precedence over a running VPN service.
              val currentConnectionStatus = uiState.status
              val isConnectionHealthy = isRunning && (
                  currentConnectionStatus !is MainStatus.ConnectionTest ||
                      currentConnectionStatus.result.delayMillis >= 0L
              )
          ''')
