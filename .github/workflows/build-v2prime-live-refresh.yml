          bottom.write_text('''package com.v2ray.ang.ui.main
          
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.Box
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.foundation.layout.height
          import androidx.compose.foundation.layout.navigationBarsPadding
          import androidx.compose.foundation.layout.offset
          import androidx.compose.foundation.layout.padding
          import androidx.compose.foundation.layout.size
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.material3.Icon
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.AbsoluteAlignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.shadow
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.res.stringResource
          import androidx.compose.ui.semantics.Role
          import androidx.compose.ui.semantics.contentDescription
          import androidx.compose.ui.semantics.semantics
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import com.v2ray.ang.R
          
          @Composable
          fun MainBottomBar(
              displayText: String,
              isRunning: Boolean,
              isConnected: Boolean,
              isDarkTheme: Boolean,
              isRepairing: Boolean,
              onAction: (MainAction) -> Unit,
          ) {
              val barGradient = if (isConnected) {
                  Brush.horizontalGradient(listOf(Color(0xFF128650), Color(0xFF0F6242)))
              } else {
                  Brush.horizontalGradient(listOf(Color(0xFFC53B4A), Color(0xFF87293D)))
              }
              val powerGradient = if (isRunning) {
                  Brush.linearGradient(listOf(Color(0xFF45D8A4), Color(0xFF0C795B)))
              } else {
                  Brush.linearGradient(listOf(Color(0xFF8294AC), Color(0xFF3C526F)))
              }
              val statusText = when {
                  isConnected -> displayText
                  isRunning -> "اتصال ناموفق"
                  else -> "کانفیگ قطع است"
              }
          
              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(barGradient)
                      .navigationBarsPadding()
              ) {
                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(88.dp)
                          .clickable { onAction(MainAction.TestCurrentServer) },
                  ) {
                      Text(
                          text = statusText,
                          fontSize = 15.sp,
                          color = Color.White,
                          fontWeight = FontWeight.SemiBold,
                          modifier = Modifier
                              .align(AbsoluteAlignment.CenterRight)
                              .padding(start = 106.dp, end = 22.dp)
                              .semantics { contentDescription = statusText },
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis,
                      )
                  }
                  Box(
                      modifier = Modifier
                          .align(AbsoluteAlignment.TopLeft)
                          .offset(x = 15.dp, y = (-9).dp)
                          .size(76.dp)
                          .shadow(13.dp, CircleShape)
                          .clip(CircleShape)
                          .background(powerGradient)
                          .border(3.dp, Color.White.copy(alpha = 0.8f), CircleShape)
                          .clickable(
                              enabled = !isRepairing,
                              role = Role.Button,
                              onClick = { onAction(MainAction.ToggleService) }
                          ),
                      contentAlignment = androidx.compose.ui.Alignment.Center,
                  ) {
                      Icon(
                          painter = painterResource(R.drawable.ic_power_beauty_24dp),
                          contentDescription = stringResource(if (isRunning) R.string.acc_stop else R.string.acc_start),
                          tint = Color.White,
                          modifier = Modifier.size(41.dp),
                      )
                  }
              }
          }
          ''', encoding='utf-8')
          
          # Maintain independent install and descriptive app name.
          gradle = Path('V2rayNG/app/build.gradle.kts')
          replace_once(gradle, 'applicationIdSuffix = ".beautyrepairpower"', 'applicationIdSuffix = ".beautyrepairstatus"')
          replace_once(gradle, '2.3.13-REPAIR-POWER', '2.3.13-REPAIR-STATUS')
          strings = Path('V2rayNG/app/src/main/res/values/strings.xml')
          replace_once(strings, 'v2rayNG BEAUTY REPAIR</string>', 'v2rayNG BEAUTY STATUS</string>')
          
          # Smoke checks before Android/Gradle build.
          assert 'AbsoluteAlignment.TopLeft' in bottom.read_text()
          assert 'text = "قطع"' in p.read_text()
          assert 'isConnectionHealthy = isConnectionHealthy' in (ui/'MainScreen.kt').read_text()
          assert 'onAction(MainAction.ToggleService)' in bottom.read_text()
          print('BEAUTY REPAIR STATUS layout patch applied successfully')
          PY

