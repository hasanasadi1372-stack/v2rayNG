                              MainAction.RepairConnection -> repairConnection()
          ''')
          edit('MainActivity.kt', '    private fun handleFabAction() {\n', '''    private fun repairConnection() {
                  if (repairJob?.isActive == true) return
                  repairJob = lifecycleScope.launch {
                      mainViewModel.setRepairing(true)
                      try {
                          if (mainViewModel.uiState.value.isRunning) {
                              LauncherManager.stopService(this@MainActivity)
                              val stopped = withTimeoutOrNull(10_000L) {
