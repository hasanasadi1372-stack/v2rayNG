      - name: Add accessible clipboard button to the compact top row
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          base = Path('V2rayNG/app/src/main')
          top = base / 'java/com/v2ray/ang/ui/main/MainTopBar.kt'
          content = top.read_text(encoding='utf-8')
          target = '''            CompactMainActionButton(
                          title = stringResource(R.string.auto_update_short),
                          drawable = R.drawable.ic_refresh_24dp,
                          enabled = !isLoading,
                          onClick = { onAction(MainAction.UpdateSubscriptions) },
                      )'''
          replacement = '''            CompactMainActionButton(
                          title = stringResource(R.string.auto_clipboard_short),
                          drawable = R.drawable.ic_copy,
                          enabled = !isLoading,
                          onClick = { onAction(MainAction.ImportClipboard) },
                      )
          ''' + target
          if content.count(target) != 1:
              raise SystemExit('Cannot locate BEAUTY top-row action; source version mismatch')
          content = content.replace(target, replacement, 1)
          if content.count('modifier = Modifier.size(72.dp),') != 1:
              raise SystemExit('Cannot locate compact button size')
          content = content.replace('modifier = Modifier.size(72.dp),', 'modifier = Modifier.size(66.dp),', 1)
          content = content.replace('Compact elevated controls with a consistent 72dp square tap target.', 'Four compact square actions: clipboard, update, real delay and sort.')
          top.write_text(content, encoding='utf-8')

          for locale, label in [('values', 'Clipboard'), ('values-fa', 'کلیپ‌بورد')]:
              f = base / 'res' / locale / 'strings.xml'
              xml = f.read_text(encoding='utf-8')
              marker = '    <string name="auto_update_short">'
              if xml.count(marker) != 1 or 'name="auto_clipboard_short"' in xml:
                  raise SystemExit('Cannot safely insert clipboard text: ' + str(f))
              xml = xml.replace(marker, f'    <string name="auto_clipboard_short">{label}</string>\n' + marker, 1)
              f.write_text(xml, encoding='utf-8')
          PYCODE
          grep -Fq 'MainAction.ImportClipboard' V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainTopBar.kt
          grep -Fq 'auto_clipboard_short' V2rayNG/app/src/main/res/values/strings.xml
          grep -Fq 'auto_clipboard_short' V2rayNG/app/src/main/res/values-fa/strings.xml

