          strings = root / 'src/main/res/values/strings.xml'
          content = strings.read_text(encoding='utf-8')
          content, n = re.subn(
              r'(<string name="app_name" translatable="false">)[^<]*(</string>)',
              lambda m: m.group(1) + 'V2Prime' + m.group(2), content, count=1,
          )
          if n != 1:
              raise SystemExit('Could not find app_name string to brand')
          strings.write_text(content, encoding='utf-8')

          # Let round Android launchers use the adaptive rounded icon too.
          manifest = root / 'src/main/AndroidManifest.xml'
          xml = manifest.read_text(encoding='utf-8')
          tag = 'android:icon="@mipmap/ic_launcher"'
          if xml.count(tag) < 1:
              raise SystemExit('App icon reference not found in manifest')
          xml = xml.replace(tag, tag + '\n        android:roundIcon="@mipmap/ic_launcher_round"', 1)
          manifest.write_text(xml, encoding='utf-8')

          for density in ('mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi'):
              for file_name in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  assert (root/'src/main/res'/('mipmap-'+density)/file_name).is_file()
          assert (root/'src/main/res/mipmap-anydpi-v26/ic_launcher.xml').is_file()
          print('V2Prime name, launcher icons and independent package configured')
          V2PRIME_BRAND

      - name: Fix localized V2Prime title and connection selection notices
        shell: bash
        run: |
          set -euo pipefail
          # Source overlay: reviewed V2Prime Kotlin/resources only; no changes pushed to repo.
          # Keep source overlays outside workflow YAML: GitHub limits workflow files to 500 KB.
          # Verify the patch bytes before applying; the files are tracked in this repository.
          echo "5afbb25b6398e2a95c7de9edb5d4cd289a0eff89c20c0ecbc89f5689704e3f7b  .github/workflows/v2prime-status-overlay.tar.gz" | sha256sum -c -
          tar -xzf .github/workflows/v2prime-status-overlay.tar.gz -C "$GITHUB_WORKSPACE"
          # Localized launcher names, independent app ID, and completed scan UI must all exist.
          grep -Fq '>V2Prime</string>' V2rayNG/app/src/main/res/values-fa/strings.xml
          grep -Fq 'applicationIdSuffix = ".v2primefix"' V2rayNG/app/build.gradle.kts
          grep -Fq 'AutoSelectionStage.READY' V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt
          grep -Fq 'در حال انتخاب بهترین کانفیگ' V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainScreen.kt

      - name: Apply actual subscription refresh and connected tap-to-test UI
        run: |
          set -euo pipefail
          echo "76c69fbbb8a93f35c748bc70f6316802edd2e6c511b69b88c168855252a77d02  .github/workflows/v2prime-live-refresh-overlay.tar.gz" | sha256sum -c -
          tar -xzf .github/workflows/v2prime-live-refresh-overlay.tar.gz -C "$GITHUB_WORKSPACE"
          grep -Fq 'isUpdatingSubscriptions' V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainViewModel.kt
          grep -Fq 'refreshSubscriptionsOnForeground()' V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainActivity.kt
          grep -Fq 'در حال بروزرسانی اشتراک' V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainTopBar.kt
          grep -Fq 'متصل است؛ برای بررسی ضربه بزنید' V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/MainScreen.kt
          grep -Fq 'applicationIdSuffix = ".v2primegreen"' V2rayNG/app/build.gradle.kts

      - name: Build APK
        run: |
          cd V2rayNG
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod 755 gradlew
          ./gradlew :app:assemblePlaystoreDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: V2Prime-Live-Refresh-debug-apk
          path: V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
          if-no-files-found: error
          retention-days: 7
