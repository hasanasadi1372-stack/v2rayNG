          def replace_once(path, old, new):
              path = Path(path)
              text = path.read_text(encoding='utf-8')
              n = text.count(old)
              if n != 1:
                  raise RuntimeError(f'Expected exactly one match in {path}: got {n} for {old[:75]!r}')
